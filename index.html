<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Japan Tech Earnings Direction</title>
  <style>
    :root{color-scheme:dark;background:#08111f;color:#e8eef8;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;--bg:#08111f;--panel:#0d1b2c;--line:#243a52;--muted:#91a6bc;--dim:#6f879f;--accent:#63d8c6;--down:#ff8f9d;--flat:#a9b6c5}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#17365e 0,transparent 34%),var(--bg)}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:48px 0 72px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:28px}h1{font-size:clamp(28px,4vw,46px);margin:8px 0}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em}.lead,.note{color:var(--muted);line-height:1.7}.lead{max-width:760px}.pill{border:1px solid #33516f;border-radius:99px;padding:8px 12px;color:#b9cbe0;white-space:nowrap}
    .overview{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:24px;background:var(--line);gap:1px}.overview div{background:var(--panel);padding:17px 20px}.overview span{display:block;color:var(--muted);font-size:12px}.overview b{display:block;font-size:21px;margin-top:5px}
    .company-list{display:grid;gap:24px}.company{background:#0d1b2ce8;border:1px solid var(--line);border-radius:20px;overflow:hidden}.company-head{display:flex;justify-content:space-between;gap:24px;padding:22px 24px;border-bottom:1px solid var(--line);align-items:center}.company-name{display:flex;gap:14px;align-items:baseline}.company-name h2{font-size:25px;margin:0}.code{color:var(--dim);font-variant-numeric:tabular-nums}.focus{color:var(--muted);margin:7px 0 0}.headline{text-align:right;min-width:170px}.direction{font-weight:850;font-size:21px}.headline small{display:block;color:var(--muted);margin-top:5px}.positive{color:var(--accent)}.negative{color:var(--down)}.muted{color:var(--flat)}
    .company-main{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:360px}.chart-wrap{padding:20px 22px 16px;border-right:1px solid var(--line)}.chart-title{display:flex;justify-content:space-between;gap:15px;align-items:baseline}.chart-title b{font-size:16px}.chart-title span{font-variant-numeric:tabular-nums}.chart-wrap svg{display:block;width:100%;height:auto;margin-top:10px}.chart-wrap text{fill:#839bb5;font-size:11px}.grid{stroke:var(--line);stroke-width:1}.threshold{stroke:#50667d;stroke-width:1;stroke-dasharray:5 5}.zero{stroke:#71879f;stroke-width:1}.series{fill:none;stroke:var(--accent);stroke-width:2.2;vector-effect:non-scaling-stroke}.last-point{fill:var(--accent)}
    .side{padding:21px;display:flex;flex-direction:column;gap:20px}.side-block{border-bottom:1px solid #1d3249;padding-bottom:18px}.side-block:last-child{border:0;padding-bottom:0}.label{color:var(--dim);font-size:11px;letter-spacing:.07em;text-transform:uppercase}.side strong{display:block;font-size:18px;margin:5px 0}.side p{color:var(--muted);font-size:13px;line-height:1.6;margin:5px 0 0}.accuracy{font-variant-numeric:tabular-nums}.audit{color:#d6b179!important}
    .evidence{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0a1726}.kpi{padding:18px 21px;border-right:1px solid var(--line)}.kpi:last-child{border:0}.kpi-name{color:#b8c7d7;font-size:13px;min-height:38px}.kpi-value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin:7px 0}.kpi-meta{display:flex;justify-content:space-between;gap:10px;color:var(--dim);font-size:12px}.kpi-score{font-weight:750}
    .footer{margin-top:24px;display:flex;justify-content:space-between;gap:20px}.footer .note{max-width:820px}.footer a{color:var(--accent)}.error{padding:24px;color:var(--down)}
    @media(max-width:820px){header,.footer,.company-head{display:block}.pill{display:inline-block;margin-top:14px}.headline{text-align:left;margin-top:14px}.company-main{grid-template-columns:1fr}.chart-wrap{border-right:0;border-bottom:1px solid var(--line);padding:16px 8px}.evidence{grid-template-columns:1fr}.kpi{border-right:0;border-bottom:1px solid var(--line)}.overview{grid-template-columns:1fr}.company-name{display:block}.focus{margin-top:5px}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">EARNINGS DIRECTION</div><h1>日本テック企業 業績方向シグナル</h1><p class="lead">速報データから業績変化の方向を監視します。会社ごとに、時系列グラフ・現在のシグナル・根拠KPI・過去検証をまとめています。</p></div><div class="pill" id="updated">読み込み中</div></header>
  <section class="overview"><div><span>対象企業</span><b id="count">—</b></div><div><span>接続KPI</span><b id="kpis">—</b></div><div><span>判定基準</span><b>±0.45</b></div></section>
  <div class="company-list" id="companies"><div class="error">データを読み込んでいます</div></div>
  <div class="footer"><p class="note">方向スコアは増収率やEPS成長率ではなく、関連KPIが自身の過去レンジからどれだけ上振れ・下振れしているかを表します。グラフは未来データを使わず各時点で再計算し、通関統計には直近3カ月累計を使用しています。</p><p><a href="output/directional.json">方向JSON</a> · <a href="output/backtest_6762.json">TDK検証</a> · <a href="output/backtest_4062.json">イビデン検証</a></p></div>
</main><script>
const fmt=v=>Number(v).toFixed(1),cls=v=>v>=.45?'positive':v<=-.45?'negative':'muted';
function plot(c){const a=c.signal_history,w=840,h=300,l=49,r=17,t=17,b=40,iw=w-l-r,ih=h-t-b,x=i=>l+(a.length===1?0:i/(a.length-1))*iw,y=v=>t+(2.5-Math.max(-2.5,Math.min(2.5,v)))/5*ih,path=a.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(' '),ticks=[2.5,.45,0,-.45,-2.5],dates=[0,Math.floor((a.length-1)/2),a.length-1];return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${c.name}の速報月次方向スコア推移"><text x="7" y="12">方向スコア</text>${ticks.map(v=>`<line class="${v===0?'zero':Math.abs(v)===.45?'threshold':'grid'}" x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-7}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}<path class="series" d="${path}"/><circle class="last-point" cx="${x(a.length-1)}" cy="${y(a.at(-1).score)}" r="4"/>${dates.map(i=>`<text x="${x(i)}" y="${h-15}" text-anchor="${i===0?'start':i===a.length-1?'end':'middle'}">${a[i].period}</text>`).join('')}<text x="${w-r}" y="${h-2}" text-anchor="end">年月</text></svg>`}
function validation(c,b,peers){if(c.code==='6857')return {title:'SoCテスタ売上方向',period:`${b.period[0]}–${b.period[1]} · ${b.observations}期`,accuracy:`${(b.model.accuracy*100).toFixed(1)}%`,detail:`Balanced ${(b.model.balanced_accuracy*100).toFixed(1)}%`};const p=peers.find(x=>x.company.code===c.code),t=p?.targets?.operating_profit;return t?{title:'営業利益方向',period:`${t.period.join('–')} · ${t.observations}期`,accuracy:`${(t.model.accuracy*100).toFixed(1)}%`,detail:`Balanced ${(t.model.balanced_accuracy*100).toFixed(1)}%`}:null}
function companyBlock(c,b,peers){const a=c.signal_history,v=validation(c,b,peers),latest=a.at(-1),coverage=c.data_coverage??c.confidence;return `<article class="company"><div class="company-head"><div><div class="company-name"><h2>${c.name}</h2><span class="code">${c.code}</span></div><p class="focus">${c.focus}</p></div><div class="headline"><div class="direction ${cls(c.signal)}">${c.direction} ${c.signal>0?'+':''}${c.signal.toFixed(2)}</div><small>総合スコア · データ充足率 ${Math.round(coverage*100)}%</small></div></div><div class="company-main"><div class="chart-wrap"><div class="chart-title"><b>速報月次スコアの推移</b><span class="${cls(latest.score)}">最新 ${latest.score>0?'+':''}${latest.score.toFixed(2)} · ${latest.direction}</span></div>${plot(c)}<p class="note">${a[0].period}〜${latest.period} · ${a.length}カ月。+0.45以上は上向き、−0.45以下は下向き。グラフは履歴のある月次KPIのみで、上部の総合スコアにはHyperscaler Capexも含みます。</p></div><aside class="side"><div class="side-block"><div class="label">現在の読み方</div><strong>${c.direction}</strong><p>${c.interpretation}</p></div>${v?`<div class="side-block"><div class="label">過去検証 · ${v.title}</div><strong class="accuracy">的中率 ${v.accuracy}</strong><p>${v.period}<br>${v.detail}</p></div>`:''}<div class="side-block"><div class="label">データ充足率</div><strong>${Math.round(coverage*100)}%</strong><p>設定したKPIをどれだけ取得できたか。予測確率や的中確率ではありません。</p></div><div class="side-block"><div class="label">時点整合</div><strong>暫定</strong><p class="audit">未来行は不使用。ただし公表時刻と当初値のヴィンテージがないため厳密には未認証です。</p></div></aside></div><div class="evidence">${c.evidence.map(e=>`<div class="kpi"><div class="kpi-name">${e.label}</div><div class="kpi-value">${fmt(e.value)} <span style="font-size:12px;color:var(--dim)">${e.unit}</span></div><div class="kpi-meta"><span>${e.period}</span><span class="kpi-score ${cls(e.score)}">スコア ${e.score>0?'+':''}${e.score.toFixed(2)}</span></div></div>`).join('')}</div></article>`}
Promise.all([fetch('output/directional.json',{cache:'no-store'}).then(r=>r.json()),fetch('output/backtest_advantest.json',{cache:'no-store'}).then(r=>r.json()),fetch('output/backtest_6762.json',{cache:'no-store'}).then(r=>r.json()),fetch('output/backtest_4062.json',{cache:'no-store'}).then(r=>r.json())]).then(([d,b,...peers])=>{document.querySelector('#updated').textContent=`生成 ${d.generated_at}`;document.querySelector('#count').textContent=`${d.companies.length}社`;document.querySelector('#kpis').textContent=`${d.companies.reduce((n,c)=>n+c.evidence.length,0)}系列`;document.querySelector('#companies').innerHTML=d.companies.map(c=>companyBlock(c,b,peers)).join('')}).catch(e=>{document.querySelector('#companies').innerHTML=`<div class="error">データを読み込めません: ${e}</div>`});
</script></body></html>
